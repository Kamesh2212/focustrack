[package]
name = "focustrack-sync-proto"
version = "0.1.0"
description = "FocusTrack sync: record format, end-to-end encryption and API types shared by the app and the server"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
# Blocking HTTP client for the sync API (used by the desktop app and tests).
client = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }
ureq = { version = "2", features = ["json"], optional = true }
