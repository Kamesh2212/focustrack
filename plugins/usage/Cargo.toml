[package]
name = "tauri-plugin-focustrack-usage"
version = "0.1.0"
description = "FocusTrack: read app usage from the phone's operating system (Android usage access)"
edition = "2021"
license = "MIT"
publish = false
links = "tauri-plugin-focustrack-usage"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
