[package]
name = "focustrack-server"
version = "0.1.0"
description = "FocusTrack sync server: accounts, devices and an end-to-end-encrypted record store"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
focustrack-sync-proto = { path = "../crates/sync-proto" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"

[dev-dependencies]
focustrack-sync-proto = { path = "../crates/sync-proto", features = ["client"] }
