<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FocusTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/32.png" alt="" width="22" height="22" />
      <strong>FocusTrack</strong>
      <span id="status" class="status"><span class="dot"></span><span id="status-text">Checking…</span></span>
    </header>

    <div id="widgets"></div>

    <button id="open-panel" class="btn wide" type="button">Open side panel</button>
    <p class="note">Current site: <span id="current">—</span>. Only domains are shared, and only with the FocusTrack app on this computer.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
