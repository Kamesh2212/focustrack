<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FocusTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/32.png" alt="" width="22" height="22" />
      <strong>FocusTrack</strong>
    </header>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">Checking…</span></div>
    <dl>
      <dt>Current site</dt>
      <dd id="current">—</dd>
      <dt>Blocked today</dt>
      <dd id="blocked">None</dd>
    </dl>
    <p class="note">Only the domain of your active tab is shared, and only with the FocusTrack app on this computer.</p>
    <script src="popup.js"></script>
  </body>
</html>
