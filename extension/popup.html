<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FocusTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/32.png" alt="" width="22" height="22" />
      <strong>FocusTrack</strong>
      <span id="status" class="status"><span class="dot"></span><span id="status-text">Checking…</span></span>
    </header>

    <section id="focus" class="focus-banner" hidden></section>

    <div class="stats">
      <div><span class="label">Screen time</span><span id="screen" class="big">—</span></div>
      <div><span class="label">On the web</span><span id="web" class="big">—</span></div>
    </div>

    <h2>Top websites today</h2>
    <div id="sites" class="list"></div>

    <h2>Limits</h2>
    <div id="limits" class="list"></div>

    <p class="note">Current site: <span id="current">—</span>. Only domains are shared, and only with the FocusTrack app on this computer.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
