<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked by FocusTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="blocked">
    <main>
      <img src="icons/128.png" alt="" width="72" height="72" />
      <h1><span id="domain">This site</span><span id="headline-rest"> is blocked for today</span></h1>
      <p id="reason">You've reached the daily limit you set in FocusTrack. It unblocks at midnight.</p>
      <p class="note" id="how">To change this, open FocusTrack → Usage Limits.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
